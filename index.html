<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Wenzel Club</title>
<style>
  :root{--bg:#111;--fg:#f5f1e6;--gold:#f2c230;--muted:#a59f90}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;text-align:center}
  h1{font-size:clamp(2.4rem,9vw,4.5rem);letter-spacing:.06em;margin:0;color:var(--gold);text-transform:uppercase}
  p{color:var(--muted);margin:.6rem 0 2rem}
  a.app{display:block;width:min(320px,100%);margin:.5rem auto;padding:1rem;border:2px solid var(--gold);border-radius:14px;
        color:var(--fg);text-decoration:none;font-weight:600;font-size:1.1rem}
  a.app:hover{background:var(--gold);color:var(--bg)}
  footer{margin-top:3rem;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
  <h1>Wenzel Club</h1>
  <p>Gemeinsam spielen, testen, feiern.</p>
  <a class="app" href="/biertasting/">🍺 Biertasting</a>
  <footer>Ein privates Projekt von Jonathan Wenzel</footer>
</body>
</html>

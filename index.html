<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b2147">
<title>Wenzel Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#141a3a;--ink:#fdf6ea;--muted:#c9c2d9;--accent:#ffcf70}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column}
header{position:absolute;top:0;left:0;right:0;padding:clamp(16px,3vw,36px) clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(2rem,5.5vw,4.2rem);margin:0;line-height:1;letter-spacing:-.01em;text-shadow:0 2px 20px #0006}
.claim{margin:.5rem 0 0;color:var(--muted);font-size:clamp(.9rem,1.6vw,1.15rem)}
.badge{pointer-events:auto;border:1px solid #ffffff40;border-radius:999px;padding:8px 14px;font-size:.85rem;color:var(--ink);background:#ffffff14;backdrop-filter:blur(6px);cursor:pointer}
.stage{position:relative;flex:1;min-height:100vh;min-height:100dvh;overflow:hidden;background:linear-gradient(#232655 0 50%,#355a47 50% 100%)}
svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{cursor:pointer;outline:none}
.spot .halo{fill:#ffe9a8;opacity:0;transition:opacity .35s}
.spot:hover .halo,.spot:focus-visible .halo{opacity:.28}
.spot .tag{transition:transform .3s cubic-bezier(.2,1.5,.4,1);transform-box:fill-box;transform-origin:center bottom}
.spot:hover .tag,.spot:focus-visible .tag{transform:translateY(-6px) scale(1.06)}
.spot.soon{cursor:default}
.spot.soon .obj{filter:saturate(.55) brightness(.8)}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.25)}}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{0%,100%{opacity:0;transform:translate(0,0)}30%{opacity:1}50%{transform:translate(18px,-14px)}70%{opacity:.9}}
.bulb{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
.ripple{animation:rip 5s linear infinite}
@keyframes rip{0%{opacity:.0}40%{opacity:.6}100%{opacity:0;transform:translateX(30px)}}
.chips{position:absolute;bottom:clamp(14px,3vh,28px);left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px;z-index:2}
.chips button{font:inherit;font-weight:600;font-size:.9rem;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;background:#fdf6eaee;color:#2b2340}
.chips button.soon{background:#ffffff22;color:var(--muted);border:1px solid #ffffff33}
footer{position:absolute;bottom:4px;right:12px;font-size:.72rem;color:#ffffff66;z-index:2}
footer a{color:inherit;text-decoration:none}
dialog{border:0;border-radius:24px;padding:28px 24px;max-width:360px;width:calc(100% - 32px);background:#fdf6ea;color:#2b2340;box-shadow:0 30px 80px #0008}
dialog::backdrop{background:#0b0f2bb3;backdrop-filter:blur(3px)}
dialog h2{font-family:Fraunces,Georgia,serif;margin:0 0 6px;font-size:1.6rem}
dialog p{margin:0 0 16px;color:#5d5470;line-height:1.5}
dialog input{width:100%;font:inherit;font-size:1.4rem;letter-spacing:.25em;text-transform:uppercase;text-align:center;padding:12px;border-radius:14px;border:2px solid #e3dccd;background:#fff;color:#2b2340}
dialog input:focus{outline:none;border-color:#ff6b57}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog button{flex:1;font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px;cursor:pointer}
dialog .go{background:#ff6b57;color:#fff}
dialog .no{background:#ece5d6;color:#2b2340}
.err{color:#c0392b;font-size:.85rem;min-height:1.2em;margin-top:6px}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#fdf6ea;color:#2b2340;font-weight:600;padding:12px 18px;border-radius:999px;z-index:9;box-shadow:0 10px 30px #0006;animation:drop .3s ease}
@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

  <button class="badge" id="btn-invite" type="button">🔑 Ich habe eine Einladung</button>

<dialog id="dlg">
  <h2>Nur mit Einladung</h2>
  <p>Wer eingeladen ist, hat einen Link oder einen Code bekommen. Gib den Code hier ein:</p>
  <input id="code" maxlength="6" autocomplete="off" placeholder="K7QF" aria-label="Einladungscode">
  <div class="err" id="err"></div>
  <div class="row"><button class="no" type="button" id="cancel">Zurück</button><button class="go" type="button" id="go">Rein da</button></div>
</dialog>

<script>
"use strict";
const svg = document.querySelector("svg.scene");
function fit(){
  const portrait = innerWidth / innerHeight < 0.95;
  svg.setAttribute("viewBox", portrait ? "850 175 680 715" : "0 0 1600 900");
  svg.setAttribute("preserveAspectRatio", portrait ? "xMidYMid meet" : "xMidYMid slice");
}
fit(); addEventListener("resize", fit);
const dlg = document.getElementById("dlg"), inp = document.getElementById("code"), err = document.getElementById("err");
let target = "/biertasting/";
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=> t.remove(), 2400);
}
function askCode(dest){
  target = dest || "/biertasting/"; inp.value = ""; err.textContent = "";
  if (dlg.showModal) dlg.showModal(); else location.href = target;
  setTimeout(()=> inp.focus(), 50);
}
function go(){
  const c = inp.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (c.length < 4) { err.textContent = "Der Code hat 4 Zeichen."; return; }
  location.href = target + "?code=" + encodeURIComponent(c);
}
document.getElementById("go").onclick = go;
document.getElementById("cancel").onclick = () => dlg.close();
inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
inp.addEventListener("input", () => err.textContent = "");
document.getElementById("btn-invite").onclick = () => askCode("/biertasting/");
document.getElementById("spot-bier").addEventListener("click", e => { e.preventDefault(); askCode("/biertasting/"); });
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => askCode(b.dataset.go));
document.querySelectorAll("[data-soon]").forEach(el => {
  const f = () => toast(el.dataset.soon + " wird gerade aufgebaut … bald geht's los!");
  el.addEventListener("click", f);
  el.addEventListener("keydown", e => { if (e.key === "Enter") f(); });
});
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF7EC">
<title>Biertasting · Wenzel Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF7EC; --card:#FFFFFF; --card2:#FFF1E2; --line:#F1E3CF;
  --coral:#FF6B57; --coral-d:#E8503C; --sky:#7CC4E8; --sky-l:#E3F3FB; --sun:#FFD34E; --sun-l:#FFF3C4;
  --mint:#5FD3A6; --ink:#2B2340; --muted:#7A6F8C; --bad:#D9442E;
  --fg:var(--ink); --gold:var(--coral); --ok:#1FA971; --radius:22px;
  --shadow:0 6px 0 #2b23400d, 0 12px 30px #2b234012;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 12% 8%,#FFE3DD 0 120px,transparent 121px),radial-gradient(circle at 92% 18%,#E3F3FB 0 90px,transparent 91px),radial-gradient(circle at 80% 92%,#FFF3C4 0 140px,transparent 141px)}
.wrap{max-width:580px;margin:0 auto;padding:18px 16px 60px}
body.home .wrap{max-width:1120px}
h1,h2,h3,.fred{font-family:Fredoka,Inter,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:2.5rem;color:var(--coral);line-height:1}
h2{font-size:1.45rem;color:var(--ink);margin:0 0 10px}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 18px;font-weight:700;background:var(--card2);color:var(--ink);transition:transform .1s}
button:active{transform:scale(.97)}
button.primary{background:var(--coral);color:#fff;width:100%;font-size:1.05rem;box-shadow:0 5px 0 var(--coral-d)}
button.primary:active{box-shadow:0 2px 0 var(--coral-d);transform:translateY(3px)}
button.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
button.small{padding:8px 14px;font-size:.9rem}
button:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.err{background:#FFE3DD;color:#7A1F12;padding:12px 14px;border-radius:16px;margin:10px 0;font-size:.95rem;font-weight:600}
.okmsg{color:var(--ok);font-weight:700}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--card2);font-size:.85rem;margin:4px 4px 0 0;font-weight:600}
.pill.on{background:var(--sun);color:#4A3A00}
.pill.done{background:#DFF7EE;color:#0E6B47}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:2px dashed var(--line)}
.list li:last-child{border-bottom:0}
.big-nr{font-family:Fredoka,sans-serif;font-weight:600;font-size:4.6rem;line-height:1;color:var(--coral);text-align:center}
.nowcard .big-nr{color:#fff}
.center{text-align:center}
.stars{display:flex;gap:6px;margin-top:4px}
.stars button{flex:1;padding:10px 0;font-size:1.6rem;background:var(--card2);line-height:1;filter:grayscale(1);opacity:.45;border-radius:16px}
.stars button.on{filter:none;opacity:1;background:var(--sun-l)}
.crit{margin:16px 0}
.crit .head{display:flex;justify-content:space-between;align-items:baseline}
.crit .head b{font-size:1.05rem;font-family:Fredoka,sans-serif}
.crit .head span{color:var(--muted);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:7px 12px;font-weight:600;font-size:.88rem;background:var(--card2)}
.chips button.on{background:var(--sun);color:#4A3A00}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
.tabs button{min-width:48px;padding:9px 0;font-family:Fredoka,sans-serif;font-size:1.2rem}
.tabs button.on{background:var(--coral);color:#fff}
.tabs button.rated{box-shadow:inset 0 -4px 0 var(--mint)}
.progress{height:12px;border-radius:99px;background:#ffffff66;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.res{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.res:last-child{border-bottom:0}
.res .platz{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.6rem;color:#fff;background:var(--sky);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;flex:none}
.res:nth-child(1) .platz{background:var(--sun);color:#4A3A00}
.res .info{flex:1;min-width:0}
.res .info b{display:block;font-size:1.08rem}
.res .score{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.5rem;text-align:right}
.res.hidden .platz{background:var(--line);color:var(--muted)}
.res.hidden .info b{color:var(--muted)}
.starline{letter-spacing:2px;font-size:.95rem}
.stars5{background:linear-gradient(90deg,var(--sun) var(--p),#E8DCC8 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.tag{font-size:.8rem;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar button{flex:1;min-width:120px}
.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.statusbar button{padding:10px 4px;font-size:.85rem}
.statusbar button.on{background:var(--coral);color:#fff}
.secret{background:var(--sun-l);border:2px dashed #E9B800;border-radius:18px;padding:14px;text-align:center;cursor:pointer}
.footer{color:var(--muted);text-align:center;font-size:.8rem;margin-top:30px}
.footer a{color:var(--muted)}
a{color:var(--coral-d)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 8px 30px #0003;z-index:50;animation:pop .25s ease}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.nowcard{background:var(--sky);color:#123A52;text-align:center}
.nowcard .muted{color:#123A52}
/* ---------- Startseite / Archiv ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.topbar a{font-weight:700;text-decoration:none;color:var(--ink);background:#fff;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:.9rem}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0;background:linear-gradient(var(--cream) 80%,#fff7ec00);margin:0 -4px}
.nav a{flex:none;text-decoration:none;color:var(--ink);font-weight:700;font-size:.92rem;padding:9px 15px;border-radius:999px;background:#fff;box-shadow:0 3px 0 var(--line)}
.nav a:hover{background:var(--sun)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;padding:20px 0 10px}
.hero h1{font-size:clamp(3rem,9vw,6.4rem);line-height:.9}
.hero .lead{font-size:clamp(1.05rem,2.2vw,1.35rem);color:var(--muted);margin:14px 0 18px;max-width:30ch}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border-radius:18px;padding:10px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:Fredoka,sans-serif;font-size:1.7rem;color:var(--coral);line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}
.glass{width:100%;max-width:330px;justify-self:center}
.bubble{animation:rise 3.5s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
.wobble{animation:wob 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.invite{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;background:var(--coral);color:#fff;border-radius:28px;padding:22px;margin:18px 0;box-shadow:0 8px 0 var(--coral-d)}
.invite h2{color:#fff}
.invite p{margin:4px 0 0;opacity:.9}
.invite .form{display:flex;gap:8px;grid-column:1/-1}
.invite input{border:0;font-size:1.3rem;letter-spacing:.25em;text-transform:uppercase;text-align:center;max-width:220px}
.invite button{background:var(--ink);color:#fff;white-space:nowrap}
.sec{margin-top:44px;scroll-margin-top:60px}
.sec>h2{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:4px}
.sec>.sub{margin-bottom:16px}
.timeline{display:grid;gap:16px}
.year{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.ybadge{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.35rem;background:var(--sky);color:#fff;border-radius:20px;padding:10px 14px;text-align:center;line-height:1.05}
.ybadge small{display:block;font-size:.7rem;font-family:Inter;font-weight:600;opacity:.9}
.year:nth-child(3n+2) .ybadge{background:var(--coral)}
.year:nth-child(3n) .ybadge{background:var(--sun);color:#4A3A00}
.year h3{font-size:1.35rem}
.year .meta{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pod div{background:var(--card2);border-radius:16px;padding:9px 10px;font-size:.9rem;min-width:0}
.pod div:first-child{background:var(--sun-l)}
.pod b{display:block;font-family:Fredoka,sans-serif;font-size:1.02rem;overflow-wrap:anywhere}
.pod span{color:var(--muted);font-size:.78rem}
.fun{background:var(--sky-l);border-radius:16px;padding:10px 14px;font-size:.92rem;color:#123A52}
details.more summary{cursor:pointer;font-weight:700;color:var(--coral-d);margin-top:10px;list-style:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
table.res-t{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
table.res-t td{padding:7px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
table.res-t td:first-child{font-family:Fredoka,sans-serif;font-weight:600;color:var(--coral);width:32px}
table.res-t td.r{text-align:right;white-space:nowrap}
.year.next{background:var(--ink);color:#fff}
.year.next .ybadge{background:var(--sun);color:#4A3A00}
.year.next .meta{color:#cfc7e0}
.wikibar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wikibar input{max-width:340px;flex:1;border-radius:999px}
.wikigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.beer{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font-weight:400;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.beer:hover{transform:translateY(-3px) rotate(-.5deg)}
.beer b{font-family:Fredoka,sans-serif;font-size:1.08rem}
.beer .ys{display:flex;gap:4px;flex-wrap:wrap}
.beer .ys span{font-size:.72rem;font-weight:700;background:var(--card2);border-radius:999px;padding:2px 8px}
.beer .ys span.w{background:var(--sun)}
.meter{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.meter>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--coral))}
.trophy{font-size:.8rem;font-weight:700;color:#8a6a00}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.board .card{margin:0}
.board ol{margin:0;padding-left:22px;line-height:1.7}
.board ol li span{color:var(--muted);font-size:.85rem}
.know{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.know .card{margin:0}
.know h3{font-size:1.15rem;margin-bottom:6px}
.know p{margin:0;line-height:1.55;color:#4a4160}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:#fff;border-radius:999px;padding:6px 12px;font-size:.88rem;box-shadow:0 2px 0 var(--line)}
.words span:nth-child(5n+1){background:var(--sun-l)}.words span:nth-child(7n+3){background:#FFE3DD}.words span:nth-child(4n+2){background:var(--sky-l)}
dialog.wd{border:0;border-radius:28px;padding:0;max-width:520px;width:calc(100% - 24px);max-height:86vh;background:var(--cream);color:var(--ink);box-shadow:0 30px 80px #2b234055}
dialog.wd::backdrop{background:#2b234080;backdrop-filter:blur(3px)}
.wd .wh{background:var(--coral);color:#fff;padding:20px 22px;position:sticky;top:0}
.wd .wh h2{color:#fff;font-size:1.7rem}
.wd .wb{padding:16px 22px 22px}
.wd .x{position:absolute;right:14px;top:14px;background:#ffffff33;color:#fff;width:38px;height:38px;padding:0;font-size:1.2rem}
.app{background:#fff;border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 var(--line)}
.app .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.app .h b{font-family:Fredoka,sans-serif;font-size:1.15rem}
.app .q{font-size:.88rem;color:#4a4160;margin-top:6px;line-height:1.45}
@media (max-width:760px){.hero{grid-template-columns:1fr}.glass{max-width:200px;grid-row:1}.year{grid-template-columns:1fr}.ybadge{justify-self:start}.invite{grid-template-columns:1fr}}
/* ---------- Wissen: Porträt, Karte, Rettung ---------- */
dialog.wd{max-width:760px}
.wd .x{z-index:3}
.wd .wh{z-index:2}
.wd .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.9;margin-bottom:4px;padding-right:44px}
.beer .akte{font-size:.68rem;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.beer .ort{font-size:.82rem;color:#4a4160}
.ptop{display:grid;grid-template-columns:1fr 190px;gap:14px;align-items:start;margin-bottom:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
.facts div{border-bottom:1px dashed var(--line);padding-bottom:6px;min-width:0}
.facts dt{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts dd{margin:2px 0 0;font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.pmap{background:#fff;border-radius:18px;padding:6px;box-shadow:0 3px 0 var(--line)}
.pblock{background:#fff;border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 var(--line)}
.pblock h4{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.02rem;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pblock p{margin:0;line-height:1.55;color:#3d3452;font-size:.94rem}
.pblock.heute{background:var(--sky-l)}.pblock.fun{background:var(--sun-l)}.pblock.myst{background:#FFE3DD}
.prost{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.3rem;color:var(--coral-d);text-align:center;padding:14px 10px 8px;line-height:1.3}
.prost small{display:block;font-family:Inter,sans-serif;font-weight:600;font-size:.72rem;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.ktag{font-family:Inter,sans-serif;font-size:.72rem;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px}
.kbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kb{background:var(--ink);color:#fff;text-decoration:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem}
.ph{font-size:1.15rem;margin:18px 0 0}
details.src ul{margin:6px 0 0;padding-left:18px;font-size:.82rem;line-height:1.7;overflow-wrap:anywhere}
svg.bmap{width:100%;height:auto;display:block;border-radius:18px}
svg.bmap .sea{fill:#E3F3FB}
svg.bmap .ld{fill:#FFF7EC;stroke:#D9C9B0;stroke-width:.8;stroke-linejoin:round}
svg.bmap .ld.de{fill:#FFEFC2;stroke:#C9A86A;stroke-width:1.1}
svg.bmap .cdot{fill:#7A6F8C}
svg.bmap .clbl{font:600 11px Inter,sans-serif;fill:#7A6F8C;paint-order:stroke;stroke:#FFF7EC;stroke-width:3px}
svg.bmap .hlbl{font:800 12px Inter,sans-serif;fill:#2B2340;paint-order:stroke;stroke:#fff;stroke-width:3.5px}
svg.bmap .pin{cursor:pointer;transition:opacity .2s}
svg.bmap .pin:hover circle:nth-child(2),svg.bmap .pin:focus circle:nth-child(2){stroke-width:3}
svg.bmap .pin.dim{opacity:.13}
svg.bmap .pc{font:800 10px Inter,sans-serif;text-anchor:middle;pointer-events:none}
svg.bmap .pin-mini{fill:#C9BBA4}
svg.bmap .hl-ring{fill:#E8503A33;stroke:#E8503A;stroke-width:2}
svg.bmap.small .ld{stroke-width:1.4}
.kgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
.kmap{margin:0}.kside .card:first-child{margin-top:0}
.kbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;background:transparent;font-size:.88rem}
.seg button.on{background:var(--ink);color:#fff}
.chips button.on{background:var(--coral);color:#fff}
.klegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.8rem;font-weight:600}
.klegend i,.ekgrid i,.clegend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid #2B2340;box-sizing:border-box}
.klegend i.hm{background:#2B2340;border-radius:3px}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.kstats div{background:var(--card2);border-radius:14px;padding:8px 10px;min-width:0}
.kstats b{display:block;font-family:Fredoka,sans-serif;font-size:1.25rem;line-height:1.1}
.kstats span{font-size:.72rem;color:var(--muted);font-weight:600}
.kline{margin:6px 0 0;font-size:.9rem}
.rbar{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 24px;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
.rbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar div{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--sky);border-radius:99px}
.rbar b{text-align:right;font-family:Fredoka,sans-serif}
.words a,.ek a{color:inherit;text-decoration:none}
.einkauf{margin-top:14px}
.ekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ekgrid h4{font-family:Fredoka,sans-serif;font-weight:600;font-size:1rem;margin:0 0 8px}
.ekgrid h4 span{color:var(--muted);font-family:Inter,sans-serif;font-size:.8rem}
.ek{display:flex;flex-wrap:wrap;gap:5px}
.ek a{background:var(--card2);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.ek a:hover{background:var(--sun-l)}
.ktip{position:absolute;display:none;z-index:60;background:var(--ink);color:#fff;font-size:.82rem;font-weight:600;padding:7px 11px;border-radius:12px;max-width:280px;pointer-events:none;box-shadow:0 8px 24px #2b234040}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpis div{background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpis b{display:block;font-family:Fredoka,sans-serif;font-size:2rem;line-height:1.05;color:var(--coral-d)}
.kpis span{font-size:.82rem;color:#4a4160}
svg.chart{width:100%;max-width:760px;height:auto;display:block}
svg.chart .gl{stroke:#F1E3CF;stroke-width:1}
svg.chart .ax{font:600 11px Inter,sans-serif;fill:#7A6F8C}
svg.chart .vl{font:700 12px Inter,sans-serif;fill:#2B2340}
svg.chart .bt{font-size:13px}
svg.chart .bar{cursor:default}
svg.chart .bar:hover path{opacity:.8}

// Animationen bei neuer Auslosung / Auflösung
function handleEvents(){
  const ev = S.state?.event; if (!ev) return;
  if (S.seenDraw === null) S.seenDraw = ev.draw_seq;
  if (S.seenReveal === null) S.seenReveal = ev.revealed;
  if (ev.draw_seq > S.seenDraw) {
    S.seenDraw = ev.draw_seq;
    if (MODE !== "admin") { drawAnimation(ev.current_nr); try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(e){} }
    if (MODE === "guest") { S.selNr = ev.current_nr; S.draft = null; }
  }
  const lv = (S.state?.live||[]).map(x=>x.nr); S.liveNew = null;
  if (S.seenLive) { const nw = lv.find(n=>!S.seenLive.includes(n)); if (nw) S.liveNew = nw; }
  S.seenLive = lv;
  if (ev.revealed !== S.seenReveal) { S.revealFresh = ev.revealed > S.seenReveal; S.seenReveal = ev.revealed; }
}
function drawAnimation(nr){
  const o = document.getElementById("overlay");
  const small = MODE !== "tv" ? " small" : "";
  o.innerHTML = `<div class="overlay${small}"><div class="cap">Los wird gezogen …</div><div class="roll" id="roll">?</div></div>`;
  const max = Math.max(nr, (S.state?.beers||[]).length, 3);
  let i = 0;
  const t = setInterval(()=>{
    const el = document.getElementById("roll"); if (!el) return clearInterval(t);
    el.textContent = 1 + Math.floor(Math.random()*max);
    if (++i > 22) {
      clearInterval(t); el.textContent = nr; el.classList.add("enter");
      o.querySelector(".cap").textContent = "Bier Nr.";
      setTimeout(()=> o.innerHTML = "", MODE === "tv" ? 3500 : 1800);
    }
  }, 90);
}

// ======================== FERNSEHER ===================================
/* ---------- Wissen: Bier-Porträts, Bierkarte, Rettet das Bier ---------- */
const WS = window.BT_WISSEN || {info:{}, karten:null, wirtschaft:null};
const WI = Object.fromEntries(A.wiki.map((w,i)=>[w.name,i]));
const INF = n => WS.info[n] || {};
const KT = {
  "bundesweit":            {c:"#E8503A", l:"Bundesweit im Handel", e:"🛒"},
  "regional":              {c:"#2E86C1", l:"Regional zu haben", e:"🏡"},
  "international":         {c:"#1F9E74", l:"Import aus dem Ausland", e:"🌍"},
  "discounter":            {c:"#D99A00", l:"Discounter-/Handelsmarke", e:"🏷️"},
  "nicht mehr erhältlich": {c:"#FFFFFF", l:"Nicht mehr erhältlich / unbekannt", e:"🕰️", hollow:true}
};
const kt = n => KT[INF(n).kaufen_typ] || KT["nicht mehr erhältlich"];
const FLAG = {"Deutschland":"🇩🇪","Polen":"🇵🇱","Tschechien":"🇨🇿","Italien":"🇮🇹","Dänemark":"🇩🇰","Belgien":"🇧🇪"};
const flag = n => FLAG[INF(n).land] || "🏳️";
const KELS = [50.06, 8.53];
function km(lat, lng){
  const r = Math.PI/180, a = Math.sin((lat-KELS[0])*r/2)**2 + Math.cos(KELS[0]*r)*Math.cos(lat*r)*Math.sin((lng-KELS[1])*r/2)**2;
  return 6371*2*Math.asin(Math.sqrt(a));
}
const kmTxt = v => Math.round(v).toLocaleString("de-DE") + " km";
const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } };
const yearsOf = n => (A.wiki[WI[n]]?.auftritte || []).map(a=>a.jahr);

/* --- Karte als SVG (Natural Earth 1:50m, vorprojiziert in wissen.js) --- */
function karteSvg(key, o = {}){
  const K = WS.karten?.[key]; if (!K) return "";
  const pins = K.pins.map((g,gi) => {
    const hit = o.hl ? g.biere.includes(o.hl) : true;
    const inYear = !o.year || g.biere.some(n => yearsOf(n).includes(Number(o.year)));
    const T = kt(g.biere[0]);
    if (o.small) {
      return hit ? "" : `<circle cx="${g.x}" cy="${g.y}" r="3.2" class="pin-mini"/>`;
    }
    const r = g.biere.length > 1 ? 10 : 7.5;
    return `<g class="pin ${inYear?"":"dim"}" data-act="pin" data-k="${key}" data-g="${gi}" tabindex="0" role="button" aria-label="${esc(g.ort||"")}: ${esc(g.biere.join(", "))}"
        data-tip="${esc((g.ort||"") + " – " + g.biere.join(", "))}">
      <circle cx="${g.x}" cy="${g.y}" r="16" fill="transparent"/>
      <circle cx="${g.x}" cy="${g.y}" r="${r}" fill="${T.c}" stroke="${T.hollow?"#7A6F8C":"#2B2340"}" stroke-width="${T.hollow?2.2:1.6}"/>
      ${g.biere.length>1 ? `<text x="${g.x}" y="${g.y+4}" class="pc" fill="${T.hollow||T.c==="#D99A00"?"#2B2340":"#fff"}">${g.biere.length}</text>` : ""}
    </g>`;
  }).join("");
  const hl = o.hl ? K.pins.find(g=>g.biere.includes(o.hl)) : null;
  const cities = o.small ? "" : K.staedte.map(s=>`<circle cx="${s.x}" cy="${s.y}" r="2.6" class="cdot"/><text x="${s.a==="l"?s.x-6:s.x+6}" y="${s.y+4}" class="clbl" text-anchor="${s.a==="l"?"end":"start"}">${esc(s.n)}</text>`).join("");
  const k = K.kelsterbach;
  const home = o.small ? `<circle cx="${k.x}" cy="${k.y}" r="4" fill="#2B2340"/>` :
    `<g class="home-mk"><path d="M${k.x-11} ${k.y+2} L${k.x} ${k.y-10} L${k.x+11} ${k.y+2} L${k.x+8} ${k.y+2} L${k.x+8} ${k.y+11} L${k.x-8} ${k.y+11} L${k.x-8} ${k.y+2} Z" fill="#2B2340" stroke="#fff" stroke-width="2"/>
      <text x="${k.x-15}" y="${k.y+22}" class="hlbl" text-anchor="end">Kelsterbach</text></g>`;
  return `<svg class="bmap ${o.small?"small":""}" viewBox="0 0 ${K.W} ${K.H}" role="img" aria-label="${key==="de"?"Deutschlandkarte":"Europakarte"} mit den Brauorten unserer Biere">
    <rect width="${K.W}" height="${K.H}" class="sea"/>
    ${K.land.map(l=>`<path d="${l.d}" class="ld ${l.hl?"de":""}"/>`).join("")}
    ${cities}${pins}${home}
    ${hl ? `<circle cx="${hl.x}" cy="${hl.y}" r="${key==="de"?14:12}" class="hl-ring"/><circle cx="${hl.x}" cy="${hl.y}" r="${key==="de"?8:7}" fill="#E8503A" stroke="#2B2340" stroke-width="2"/>` : ""}
  </svg>`;
}

/* --- Bierkarte-Sektion --- */
function karteBlock(){
  const key = S.kk || "de", year = S.ky || "";
  const loc = A.wiki.filter(w => INF(w.name).lat != null);
  const dist = loc.map(w => ({n:w.name, d:km(INF(w.name).lat, INF(w.name).lng)})).sort((a,b)=>a.d-b.d);
  const avg = dist.reduce((s,x)=>s+x.d,0) / (dist.length||1);
  const orte = new Set(loc.map(w=>INF(w.name).ortKurz)).size;
  const laender = new Set(loc.map(w=>INF(w.name).land)).size;
  const reg = {};
  loc.forEach(w => { const i = INF(w.name); const r = i.land === "Deutschland" ? (i.region||"?").replace(/\s*\(.*?\)/g,"") : i.land; reg[r] = (reg[r]||0)+1; });
  const regs = Object.entries(reg).sort((a,b)=>b[1]-a[1]);
  const maxR = regs[0]?.[1] || 1;
  const counts = {}; A.wiki.forEach(w => { const t = INF(w.name).kaufen_typ || "nicht mehr erhältlich"; counts[t] = (counts[t]||0)+1; });
  const myst = A.wiki.filter(w => INF(w.name).lat == null);
  const y20 = A.jahre["2020"];
  return `<div class="kgrid">
    <div class="card kmap">
      <div class="kbar"><div class="seg">${[["de","Deutschland"],["eu","Europa"]].map(([k,l])=>`<button class="${key===k?"on":""}" data-act="kk" data-k="${k}">${l}</button>`).join("")}</div>
        <div class="chips">${["",...JAHRE].map(j=>`<button class="${String(year)===String(j)?"on":""}" data-act="ky" data-y="${j}">${j||"Alle Jahre"}</button>`).join("")}</div></div>
      ${karteSvg(key, {year})}
      <div class="klegend">${Object.entries(KT).map(([k,t])=>`<span><i style="background:${t.c};${t.hollow?"border:2px solid #7A6F8C":""}"></i>${t.l}</span>`).join("")}<span><i class="hm"></i>Unser Tasting-Ort</span></div>
      <p class="tag" style="margin:8px 0 0">Ein Punkt pro Heimatort der Marke, Zahl im Punkt = mehrere Biere vom selben Ort. Antippen öffnet das Porträt.${key==="de"?" Biere aus dem Ausland siehst du unter „Europa“.":""} 2020 lief das Tasting als Corona-Edition per Zoom – ${y20?.tester||"viele"} Wohnzimmer, ein Bildschirm.</p>
    </div>
    <div class="kside">
      <div class="card"><h3>🧭 Der Kelsterbach-Kompass</h3>
        <div class="kstats"><div><b>${orte}</b><span>Brauorte</span></div><div><b>${laender}</b><span>Länder</span></div><div><b>${kmTxt(avg)}</b><span>Ø Anreise eines Biers</span></div></div>
        <p class="kline">🏃 <b>Nächster Nachbar:</b> <a href="#" data-act="wiki" data-i="${WI[dist[0]?.n]}">${esc(dist[0]?.n||"")}</a> – nur ${kmTxt(dist[0]?.d||0)}</p>
        <p class="kline">✈️ <b>Weitgereist:</b> <a href="#" data-act="wiki" data-i="${WI[dist.at(-1)?.n]}">${esc(dist.at(-1)?.n||"")}</a> – ${kmTxt(dist.at(-1)?.d||0)} bis ins Glas</p>
      </div>
      <div class="card"><h3>🏆 Herkunfts-Ranking</h3>
        ${regs.slice(0,8).map(([r,c])=>`<div class="rbar"><span>${esc(r)}</span><div><i style="width:${c/maxR*100}%"></i></div><b>${c}</b></div>`).join("")}</div>
      <div class="card"><h3>🕵️ ${myst.length} Bier-Mysterien</h3><p class="tag" style="margin:0 0 8px">Bei diesen Bieren wissen nicht mal wir genau, woher sie kommen. Wer noch ein Foto vom Etikett hat: her damit!</p>
        <div class="words">${myst.map(w=>`<span><a href="#" data-act="wiki" data-i="${WI[w.name]}">${esc(w.name)}</a></span>`).join("")}</div></div>
    </div>
  </div>
  <div class="card einkauf"><h3>🛒 Der Einkaufszettel – wo gibt’s was?</h3><p class="tag" style="margin:0 0 10px">Für die Kasten-Planung zum nächsten Tasting. Details, Webseite und Händlersuche stehen im jeweiligen Porträt.</p>
    <div class="ekgrid">${Object.entries(KT).map(([k,t])=>`<div><h4><i style="background:${t.c};${t.hollow?"border:2px solid #7A6F8C":""}"></i>${t.e} ${t.l} <span>${counts[k]||0}</span></h4>
      <div class="ek">${A.wiki.filter(w=>(INF(w.name).kaufen_typ||"nicht mehr erhältlich")===k).map(w=>`<a href="#" data-act="wiki" data-i="${WI[w.name]}">${esc(w.name)}</a>`).join("")}</div></div>`).join("")}</div>
  </div>`;
}
function openPin(k, gi){
  const g = (k === "welt" ? RA.welt : WS.karten?.[k])?.pins?.[gi]; if (!g) return;
  if (g.biere.length === 1) return openWiki(WI[g.biere[0]]);
  dlgOpen(() => `<div class="wh"><button class="x" data-act="wiki-close" aria-label="Schließen">✕</button><div class="eyebrow">📍 Brauort</div><h2>${esc(g.ort||"")}</h2>
    <div style="opacity:.9;margin-top:4px">${g.biere.length} Biere aus unserer Geschichte · ${kmTxt(km(INF(g.biere[0]).lat, INF(g.biere[0]).lng))} von Kelsterbach</div></div>
    <div class="wb">${g.biere.map(n=>`<button class="beer" style="width:100%;margin:8px 0" data-act="wiki" data-i="${WI[n]}"><b>${esc(n)}</b><span class="tag">${esc(INF(n).brauerei||"")}</span><span class="tag">${yearsOf(n).join(", ")}</span></button>`).join("")}</div>`);
}

function wikiHtml(i){
  const w = A.wiki[i];
  const f = INF(w.name), t = kt(w.name);

function absatzChart(){
  const D = WS.wirtschaft?.absatz || []; if (!D.length) return "";
  const W = 640, H = 290, L = 40, B = 34, T = 46, max = 100;
  const bw = (W - L - 8) / D.length;
  const yv = v => T + (H - T - B) * (1 - v/max);
  const tasting = j => j >= 2015 && j <= 2020;
  const grid = [0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-4}" y1="${yv(v)}" y2="${yv(v)}" class="gl"/><text x="${L-6}" y="${yv(v)+4}" class="ax" text-anchor="end">${v}</text>`).join("");
  const bars = D.map((d,i)=>{
    const x = L + i*bw + 3, w = bw - 6, y = yv(d.wert), h = H - B - y, r = 4;
    const tip = `${d.jahr}: ${String(d.wert).replace(".",",")} Mio. hl${tasting(d.jahr)?" · Biertasting-Jahr 🍺":""}`;
    return `<g class="bar" data-tip="${tip}" tabindex="0" aria-label="${tip}">
      <rect x="${x-3}" y="${T}" width="${bw}" height="${H-B-T}" fill="transparent"/>
      <path d="M${x} ${H-B} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${H-B} Z" fill="${tasting(d.jahr)?"#E8503A":"#7CC4E8"}"/>
      ${tasting(d.jahr)?`<text x="${x+w/2}" y="${y-6}" text-anchor="middle" class="bt">🍺</text>`:""}
      <text x="${x+w/2}" y="${H-B+16}" text-anchor="middle" class="ax">${String(d.jahr).slice(2)}</text>
      ${i===0||i===D.length-1?`<text x="${x+w/2}" y="${y-(tasting(d.jahr)?24:6)}" text-anchor="middle" class="vl">${String(d.wert).replace(".",",")}</text>`:""}
    </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bierabsatz in Deutschland 2015 bis 2025 in Millionen Hektoliter">${grid}${bars}
    <text x="${L-6}" y="${T-14}" class="ax" text-anchor="end">Mio. hl</text></svg>
    <div class="clegend"><span><i style="background:#E8503A"></i>🍺 Jahre mit Wenzel-Club-Biertasting</span><span><i style="background:#7CC4E8"></i>ohne Tasting</span></div>`;
}

/* Tooltip für Karte und Diagramm */
(function(){
  let tip;
  const show = (el, x, y) => {
    if (!tip) { tip = document.createElement("div"); tip.className = "ktip"; document.body.appendChild(tip); }
    tip.textContent = el.dataset.tip; tip.style.display = "block";
    const w = tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w/2)) + "px";
    tip.style.top = (y - tip.offsetHeight - 14 + window.scrollY) + "px";
  };
  document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el) show(el, e.clientX, e.clientY); });
  document.addEventListener("mousemove", e => { const el = e.target.closest("[data-tip]"); if (el && tip) show(el, e.clientX, e.clientY); else if (tip) tip.style.display = "none"; });
  document.addEventListener("focusin", e => { const el = e.target.closest?.("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width/2, r.top); } });
  document.addEventListener("focusout", () => { if (tip) tip.style.display = "none"; });
})();

    {t:"Blind bewerten", d: e.status==="live" && e.current_nr ? (meRated ? (allRated ? "Alle haben abgegeben – die Nummer erscheint jetzt in der Live-Tabelle am Fernseher." : "Gespeichert! Die Bots probieren noch. Erst wenn alle fertig sind, zeigt der Fernseher die Punktzahl.") : `Bewerte Nr. ${e.current_nr} im Handy: Optik, Geruch, Geschmack in Sternen, dazu Schlagworte und dein Tipp.`) : "Optik, Geruch und Geschmack in Sternen – dazu Schlagworte, Notiz und ein Tipp.", done:e.status==="live" && open===0 && allRated || ["aufloesung","fertig"].includes(e.status)},

      const f = document.querySelector('[data-dev="gast"] iframe'); try { f.contentWindow.location.reload(); } catch(e){}

}

/* ======== Das Pils-Gebot: Definition, Prüfung der Historie, Check bei der Anmeldung ======== */
const PS = {
  pils:      {e:"✅", l:"Echtes Pils", c:"ok"},
  boehmisch: {e:"🇨🇿", l:"Böhmisches Pils", c:"ok"},
  grenzfall: {e:"⚠️", l:"Grenzfall", c:"warn"},
  kein:      {e:"🚫", l:"Kein Pils", c:"no"},
  af:        {e:"0,0", l:"Alkoholfrei – außer Konkurrenz", c:"af"},
};
const PA = WS.pilsAuftritt || {};
function pilsOf(name, jahr){
  if (jahr != null && PA[name + "|" + jahr]) return {s:PA[name + "|" + jahr][0], grund:PA[name + "|" + jahr][1]};
  return INF(name).pils || {s:"pils", grund:null};
}
const zaehlt = s => s === "pils" || s === "boehmisch";
function pBadge(s, opt={}){ const p = PS[s] || PS.grenzfall; if (opt.quiet && zaehlt(s)) return "";
  return `<span class="pb ${p.c}" title="${esc(p.l)}">${p.e}${opt.short ? "" : " " + esc(p.l)}</span>`; }

/* Check bei der Bier-Anmeldung */
function pilsCheck(raw){
  const n = String(raw || "").trim(); if (!n) return null;
  const k = normN(n);
  const wi = WIN[k]; if (wi != null) { const p = pilsOf(A.wiki[wi].name); return {s:p.s, msg: zaehlt(p.s) ? `Kennen wir: ${A.wiki[wi].name} – ${PS[p.s].l}.` : `${PS[p.s].l}: ${p.grund || ""}`, known:true}; }
  const ri = RIN[k]; if (ri != null) { const s = RA.biere[ri].pils; return {s, msg: zaehlt(s) ? `Steht auf unserem Pils-Radar – ${PS[s].l}, noch nie getestet. Sehr gut!` : "Steht auf dem Radar als Grenzfall – bitte Etikett prüfen.", known:true}; }
  const L = n.toLowerCase();
  const pilsWort = /pils|pilsner|pilsener|plze[nň]|pilsen/.test(L);
  if (/radler|alster|mix|cola|weizen|weißbier|weissbier|hefe|ipa\b|\bale\b|stout|porter|kölsch|koelsch|\balt\b|bock|märzen|maerzen|rauchbier|dunkel|schwarzbier/.test(L))
    return {s:"kein", msg:"Das klingt nicht nach Pils (Weizen, Ale, Bock, Radler & Co. sind raus). Bitte ein echtes Pils mitbringen."};
  if (/alkoholfrei|0[,.]0|\balc\.? ?free|\bfree\b/.test(L)) return {s:"af", msg: pilsWort ? "Alkoholfreies Pils – gerne mitbringen, läuft aber außer Konkurrenz." : "Alkoholfrei und nicht als Pils erkennbar – läuft außer Konkurrenz."};
  if (!pilsWort && /(\bhell(es)?\b|export|lager|landbier|kellerbier|zwickel|urtyp|spezial|edelstoff)/.test(L))
    return {s:"kein", msg:"Helles, Export, Lager, Landbier oder Kellerbier zählen nicht. Steht wirklich „Pils“ auf dem Etikett? Dann den Namen genau so eintragen."};
  if (pilsWort) return {s:"pils", msg:"Pils im Namen – passt."};
  if (/le[žz][aá]k|sv[eě]tl|\b1[12]\s?°/.test(L)) return {s:"boehmisch", msg:"Tschechisches helles Lager – zählt als böhmisches Pils."};
  return {s:"grenzfall", msg:"Kennen wir noch nicht. Steht „Pils“, „Pilsner“ oder „Pilsener“ auf dem Etikett? Dann bitte bestätigen."};
}
function pilsHint(name){
  const c = pilsCheck(name); if (!c) return `<p class="tag" style="margin:6px 0 0">Nur Pils! Der Pils-Check prüft deine Eingabe automatisch.</p>`;
  return `<div class="pcheck ${PS[c.s].c}">${PS[c.s].e} <b>${esc(PS[c.s].l)}</b> – ${esc(c.msg)}
    ${c.s === "grenzfall" ? `<label class="chk"><input type="checkbox" id="in-pilsok" ${S.pilsOk?"checked":""}> Ja, auf dem Etikett steht Pils / Pilsner / Pilsener</label>` : ""}</div>`;
}

/* Bereinigte Jahreswertung: nur zählende Pils */
function pilsSieger(j){
  const L = (A.jahre[j].L || []).filter(e => zaehlt(pilsOf(e.bier, +j).s));
  return L[0] || null;
}
function pilsBlock(){
  const C = {pils:0, boehmisch:0, grenzfall:0, kein:0, af:0}, faelle = [];
  JAHRE.forEach(j => (A.jahre[j].L||[]).forEach(e => { const p = pilsOf(e.bier, +j); C[p.s]++; if (!zaehlt(p.s)) faelle.push({j, e, p}); }));
  const total = Object.values(C).reduce((a,b)=>a+b,0);
  const neu = JAHRE.map(j => { const orig = A.jahre[j].L.find(e=>e.platz===1), ps = pilsSieger(j);
    return {j, orig, ps, diff: orig && ps && orig.bier !== ps.bier && !zaehlt(pilsOf(orig.bier, +j).s)}; });
  return `<div class="card gebot"><h3>🍺 Das Wenzel-Club-Pils-Gebot <span class="tag">gültig ab 2026</span></h3>
    <p style="margin:0 0 10px">Wir spezialisieren uns: <b>Bei uns kommt nur Pils ins Glas.</b> Die Bierwelt ist riesig – Pale Ale, Weizen und Helles sollen andere testen. Ein Bier gilt als Pils, wenn alles hier stimmt:</p>
    <ol class="rl">
      <li><b>Pils steht drauf.</b> Der Hersteller nennt es <i>Pils, Pilsner</i> oder <i>Pilsener</i> – auf dem Etikett oder in der Sortenangabe.</li>
      <li><b>Untergärig, hell und hopfenbetont.</b> Goldgelb, schlanker Körper, deutlich herb im Abgang. Richtwerte: Stammwürze 11–12,5 %, Alkohol 4,4–5,5 % vol, ab etwa 25 Bittereinheiten.</li>
      <li><b>Böhmisches Pils zählt.</b> Tschechische helle Lagerbiere ab 11° (<i>světlý ležák</i>) sind das Original-Pils aus der Heimat des Stils – z. B. Pilsner Urquell, Budvar, Staropramen.</li>
      <li><b>Keller-Pils, Zwickel-Pils, Bio-Pils, Italian Pils:</b> erlaubt – solange „Pils“ im Namen steht.</li>
      <li><b>Raus sind:</b> Helles, Export, Lager ohne Pils-Bezeichnung, Kellerbier, Landbier, Märzen, Bock, Weizen, Ale/IPA, Radler und alle Mischungen.</li>
      <li><b>Alkoholfreies Pils</b> ist willkommen, läuft aber <b>außer Konkurrenz</b> (eigene Mini-Wertung) – für Fahrer und als Kontrollbier.</li>
      <li><b>Im Zweifel</b> entscheidet die Pils-Kommission (Gastgeber + Vorjahressieger) <b>vor</b> dem Abend – nicht danach.</li></ol>
    <p class="tag" style="margin:8px 0 0">Die App prüft jede Bier-Anmeldung automatisch: Bekannte Biere erkennt sie aus Archiv und Radar, Weizen, Helles & Co. werden abgelehnt, unbekannte Namen muss man mit „Pils steht auf dem Etikett“ bestätigen.</p></div>
  <div class="card"><h3>🔎 Pils-Prüfung der Historie</h3>
    <p style="margin:0 0 10px">Wir haben alle ${total} Auftritte von 2015 bis 2020 nachträglich geprüft. Nicht alles, was wir im Glas hatten, war ein Pils. Die Ergebnisse bleiben in der Chronik stehen, aber für die <b>ewige Bestenliste zählen ab jetzt nur echte Pils</b>.</p>
    <div class="pstat">${Object.entries(C).map(([k,v])=>`<div class="${PS[k].c}"><b>${v}</b><span>${PS[k].e} ${esc(PS[k].l)}</span></div>`).join("")}</div>
    <h4 class="h4s">Was kein Pils war (oder nicht sicher)</h4>
    <table class="res-t"><tbody>${faelle.map(({j,e,p})=>`<tr><td>${jl(j, e.bier)}</td><td><b>${bl(e.bier)}</b> ${pBadge(p.s)}<br><span class="tag">${esc(p.grund||"")}</span></td><td class="r">${e.platz}.</td></tr>`).join("")}</tbody></table>
    <h4 class="h4s">Die Pils-bereinigten Jahressieger</h4>
    <div class="htl">${neu.map(x=>`<div class="${x.diff?"chg":""}"><b>${jl(x.j)}</b><span>${x.ps?bl(x.ps.bier):"–"}${x.diff?`<br><s>${esc(x.orig.bier)}</s> ${pBadge(pilsOf(x.orig.bier, +x.j).s, {short:true})}`:""}</span></div>`).join("")}</div>
    <p class="tag" style="margin:8px 0 0">Grenzfälle sind Biere, bei denen wir nicht mehr sicher wissen, was genau im Glas war. Wer alte Fotos vom Etikett hat: her damit – dann entscheiden wir neu.</p></div>`;
}

        : `<div class="tv-label">Gleich wird gelost</div><div class="tv-nr">🍺</div>`}
        <div style="margin-top:3vh">${players}</div></div>
      <div>${Array.isArray(st.live) && st.live.length ? `<div class="tv-big center muted">${ev.served} von ${st.beers.length} Bieren ausgeschenkt · Code <b style="color:var(--sun);letter-spacing:.2em">${esc(CODE)}</b></div>${liveTable({tv:true})}` : `${qr}<div class="tv-big center muted" style="margin-top:2vh">${ev.served} von ${st.beers.length} Bieren ausgeschenkt</div>${liveTable({tv:true})}`}</div></div>`;
  }
  // Auflösung / Ergebnis
  const res = st.results || [];
  if (ev.status === "aufloesung") {
    const total = ev.served, latest = res.find(r=>r.pos === total - ev.revealed + 1);
    const hero = latest ? `<div class="hero-tv ${S.revealFresh?"enter":""}"><div class="p">Platz ${latest.platz}</div>
        <div class="n">${esc(latest.name)}</div><div class="b">Nr. ${latest.blind_nr} · ${byWhom(latest.brought_by)} · ${euro(latest.price_per_l)}</div>
        <div class="s">${fmt1(latest.score)} <span class="starline" style="font-size:5vh">${starsFor(latest.score)}</span></div>
        <div class="b">${esc(topTags(latest.tags,5))}</div></div>`
      : `<div class="hero-tv"><div class="p">🥁</div><div class="n">Die Auflösung beginnt …</div></div>`;
    return head + `<div class="tv-grid"><div>${hero}</div><div class="tv-card tv-res">${resultsList()}</div></div>`;
  }
  // fertig
  const p = i => res[i] ? `<div class="${i===0?"p1":""}"><div class="pl">${res[i].platz}.</div><div class="nm">${esc(res[i].name)}</div>
      <div class="sc">${fmt1(res[i].score)} Punkte · ${res[i].brought_by==="Überraschung" ? "Überraschungsbier" : esc(res[i].brought_by)}</div></div>` : "<div></div>";
  return head + `<div class="podium">${p(1)}${p(0)}${p(2)}</div>
    <div class="tv-grid" style="margin-top:4vh"><div class="tv-card tv-res">${resultsList()}</div><div class="tv-big">${awards()}</div></div>`;
}

// ======================== GASTGEBER ===================================
function renderAdmin(){
  if (!CODE || !pin()) return adminLogin();
  const a = S.admin;
  if (!a) return `${header()}${errBox()}<p class="muted">Lade …</p>`;
  const ev = a.event, st = S.state;
  const unserved = a.beers.filter(b=>b.blind_nr==null).length;
  const current = a.beers.find(b=>b.blind_nr===ev.current_nr);
  const statuses = [["anmeldung","Anmeldung"],["live","Live"],["aufloesung","Auflösung"],["fertig","Ergebnis"]];
  let main = "";
  if (ev.status === "live") {
    main = `<div class="card center"><h2>Losverfahren</h2>
      ${ev.current_nr ? `<div class="muted">Aktuell im Glas</div><div class="big-nr">Nr. ${ev.current_nr}</div>
        <div class="muted">${st?.rated_count ?? 0} von ${st?.players.length ?? 0} haben bewertet</div>` : ""}
      <div style="height:12px"></div>
      <button class="primary" data-act="draw" ${unserved? "" : "disabled"}>🎲 ${ev.current_nr ? "Nächstes Bier auslosen" : "Erstes Bier auslosen"} (${unserved} übrig)</button>
      ${current ? `<div style="height:12px"></div><div class="secret" data-act="toggle-secret">${S.showSecret
          ? `<div class="muted">Nr. ${ev.current_nr} einschenken:</div><div style="font-size:1.5rem;font-weight:800;margin-top:4px">${esc(current.name)}</div><div class="muted">von ${esc(current.brought_by)} · antippen zum Verbergen</div>`
          : `🙈 <b>Ausschank:</b> antippen, um zu sehen, welches Bier als Nr. ${ev.current_nr} eingeschenkt wird`}</div>` : ""}
      ${ev.current_nr > 1 ? `<div class="toolbar" style="margin-top:12px"><button class="ghost small" data-act="cur" data-d="-1">◀ Nr. zurück</button><button class="ghost small" data-act="cur" data-d="1">Nr. vor ▶</button></div>` : ""}
      </div>`;
  }
  if (ev.status === "aufloesung") {
    main = `<div class="card center"><h2>Auflösung</h2><div class="big-nr">${ev.revealed}/${ev.served}</div>
      <div class="muted">Plätze aufgedeckt (von hinten nach vorne)</div><div style="height:12px"></div>
      <button class="primary" data-act="reveal" data-d="1" ${ev.revealed>=ev.served?"disabled":""}>🥁 Nächsten Platz aufdecken</button>
      <div class="toolbar" style="margin-top:10px"><button class="ghost small" data-act="reveal" data-d="-1">Einen zurück</button>
      <button class="ghost small" data-act="status" data-s="fertig">Alles zeigen → Ergebnis</button></div></div>`;
  }
  return `${header()}${errBox()}
  <div class="card"><div class="row"><h2 class="grow" style="margin:0">Steuerung</h2><span class="pill">Code ${esc(CODE)}</span></div>
    <div class="statusbar" style="margin-top:10px">${statuses.map(([k,l])=>`<button class="${ev.status===k?"on":""}" data-act="status" data-s="${k}">${l}</button>`).join("")}</div>
    <div class="toolbar" style="margin-top:10px">
      <button class="ghost small" data-act="open" data-u="${esc(linkFor("tv"))}">📺 Fernseher-Ansicht</button>
      <button class="ghost small" data-act="copy" data-u="${esc(location.origin + location.pathname + "?code=" + CODE)}">🔗 Gäste-Link kopieren</button>
      <button class="ghost small" data-act="open" data-u="${esc(linkFor("guest"))}">🍺 Selbst mittesten</button>
    </div></div>
  ${main}${ev.status==="live" ? liveTable() : ""}
  <div class="card"><h2>Biere (${a.beers.length})</h2>
    <ul class="list">${a.beers.map(b=>`<li><span>${b.blind_nr ? `<b style="color:var(--gold)">Nr. ${b.blind_nr}</b> · ` : ""}${S.showSecret || b.blind_nr==null ? esc(b.name) + " " + pBadge(pilsCheck(b.name)?.s || "grenzfall", {short:true}) : "🙈"}
        <span class="tag">· ${esc(b.brought_by)} · ${euro(b.price_per_l)}</span></span>
        ${b.blind_nr==null ? `<button class="ghost small" data-act="del-beer" data-id="${b.id}">✕</button>` : ""}</li>`).join("") || '<li class="muted">Noch keine Biere angemeldet.</li>'}</ul>
    <details id="add-details" ${S.addOpen?"open":""} style="margin-top:10px"><summary class="muted">+ Bier selbst hinzufügen (z. B. Überraschungsbier)</summary>
      <label>Biersorte</label><input id="ad-name" maxlength="60">
      <label>Mitgebracht von</label><input id="ad-by" maxlength="30" placeholder="leer = „Überraschung“">
      <label>Preis pro Liter</label><input id="ad-price" inputmode="decimal">
      <div style="height:10px"></div><button class="primary" data-act="add-beer">Hinzufügen</button></details></div>
  <div class="card"><h2>Tester (${a.players.length})</h2><div>${a.players.map(p=>`<span class="pill">${esc(p.name)} <span class="muted">${p.ratings}</span></span>`).join("") || '<span class="muted">Noch niemand beigetreten.</span>'}</div></div>
  <div class="card"><div class="row"><h2 class="grow" style="margin:0">Zwischenstand</h2><button class="ghost small" data-act="toggle-results">${S.showResults?"Verbergen":"Anzeigen (Spoiler!)"}</button></div>
    ${S.showResults ? `<div style="margin-top:8px">${a.results.map(r=>resultRow(r,false)).join("") || '<p class="muted">Noch keine Bewertungen.</p>'}</div>` : ""}</div>
  <div class="center"><button class="ghost small" data-act="logout">Gastgeber abmelden</button></div>${footer()}`;
}
function adminLogin(){
  const today = new Date(); const iso = today.toISOString().slice(0,10);
  return `${header()}${errBox()}
  <div class="card"><h2>Neuen Abend anlegen</h2>
    <label>Name des Abends</label><input id="ne-name" maxlength="60" value="Biertasting ${today.getFullYear()}">
    <label>Datum</label><input id="ne-date" type="date" value="${iso}">
    <label>Gastgeber-PIN (mind. 4 Zeichen – gut merken!)</label><input id="ne-pin" type="password" maxlength="20" autocomplete="new-password">
    <div style="height:12px"></div><button class="primary" data-act="create">Abend anlegen</button></div>
  <div class="card"><h2>Bestehenden Abend steuern</h2>
    <label>Abendcode</label><input id="lg-code" maxlength="6" value="${esc(CODE)}" style="text-transform:uppercase;letter-spacing:.2em">
    <label>Gastgeber-PIN</label><input id="lg-pin" type="password" maxlength="20" autocomplete="current-password">
    <div style="height:12px"></div><button class="primary" data-act="login">Anmelden</button></div>${footer()}`;
}

// ---------------------------------------------------------------------
//  Aktionen
// ---------------------------------------------------------------------
const val = id => (document.getElementById(id)?.value || "").trim();
const num = s => { s = String(s||"").replace(",", ".").replace(/[^\d.]/g,""); return s === "" ? null : Number(s); };

async function act(name, el){
  if (S.busy) return;
  const run = async (fn, okMsg) => {
    S.busy = true; el && (el.disabled = true);
    try { await fn(); S.err = ""; if (okMsg) toast(okMsg); await refresh(true); }
    catch(e){ S.err = e.message; S.lastRenderOk = false; render(); }
    finally { S.busy = false; }
  };
  const me = session();
  switch(name){
    case "go-code": {
      const c = val("in-code").toUpperCase(); if (!c) return;
      CODE = c; setUrl(); S.state = null; S.lastJson = ""; await refresh(true); startPolling(); break;
    }
    case "to-admin": location.href = location.pathname + "?modus=gastgeber"; break;
    case "join": {
      const n = val("in-name");
      await run(async()=>{ const r = await rpc("bt_join", {p_code:CODE, p_name:n}); store.set("bt_me_"+CODE, r); }, "Willkommen!");
      break;
    }
    case "reg-beer": {
      const pc = pilsCheck(val("in-beer"));
      if (pc && pc.s === "kein") { toast("🚫 Kein Pils – bitte ein Pils anmelden"); document.getElementById("pils-hint").innerHTML = pilsHint(val("in-beer")); return; }
      if (pc && pc.s === "grenzfall" && !document.getElementById("in-pilsok")?.checked) { toast("Bitte bestätigen, dass Pils auf dem Etikett steht"); document.getElementById("pils-hint").innerHTML = pilsHint(val("in-beer")); return; }
    }
      await run(()=> rpc("bt_register_beer", {p_player:me.player_id, p_token:me.token, p_name:val("in-beer"), p_price:num(val("in-price"))}), "Bier angemeldet 🍺");
      S.typedBeer = undefined; S.typedPrice = undefined; S.pilsOk = false;
      break;
    case "sel-nr": S.selNr = Number(el.dataset.nr); S.draft = null; S.lastRenderOk = false; render(); break;
    case "star": {
      const d = ensureDraft(S.selNr), k = el.dataset.k, v = Number(el.dataset.v);
      d[k] = d[k] === v ? null : v; S.dirty = true; keepTyped(); S.lastRenderOk = false; render(); break;
    }
    case "tag": {
      const d = ensureDraft(S.selNr), t = el.dataset.t;
      d.tags = d.tags.includes(t) ? d.tags.filter(x=>x!==t) : [...d.tags, t]; S.dirty = true; keepTyped(); S.lastRenderOk = false; render(); break;
    }
    case "save-rating": {
      keepTyped(); const d = ensureDraft(S.selNr), nr = S.selNr;
      if (!d.optik && !d.geruch && !d.geschmack) { S.err = "Bitte mindestens den Geschmack bewerten"; S.lastRenderOk=false; render(); return; }
      await run(async()=>{ await rpc("bt_rate", {p_player:me.player_id, p_token:me.token, p_nr:nr, p_optik:d.optik, p_geruch:d.geruch,
          p_geschmack:d.geschmack, p_notiz:d.notiz, p_tags:d.tags, p_tipp:d.tipp || null}); S.dirty = false; S.draft = null; }, "Gespeichert ✓");
      break;
    }
    // Gastgeber
    case "create": {
      const p = val("ne-pin");
      await run(async()=>{
        const c = await rpc("bt_create_event", {p_name:val("ne-name"), p_date:val("ne-date") || null, p_pin:p});
        CODE = c; savePin(p); setUrl(); startPolling();
      }, "Abend angelegt!");
      break;
    }
    case "login": {
      const c = val("lg-code").toUpperCase(), p = val("lg-pin");
      await run(async()=>{ await rpc("bt_admin_state", {p_code:c, p_pin:p}); CODE = c; savePin(p); setUrl(); startPolling(); });
      break;
    }
    case "logout": try{sessionStorage.removeItem("bt_pin_"+CODE);}catch(e){} store.del("bt_pin_"+CODE); S.admin = null; render(); break;
    case "status": {
      const s = el.dataset.s;
      const warn = {live:"Bier-Anmeldung schließen und Verkostung starten?", aufloesung:"Verkostung beenden und Auflösung starten?", fertig:"Komplettes Ergebnis zeigen?", anmeldung:"Zurück zur Anmeldung?"}[s];
      if (S.admin.event.status === s || !confirm(warn)) return;
      await run(()=> rpc("bt_admin_set_status", {p_code:CODE, p_pin:pin(), p_status:s}));
      break;
    }
    case "draw":
      S.showSecret = false;
      await run(async()=>{ const r = await rpc("bt_admin_draw", {p_code:CODE, p_pin:pin()}); drawAnimation(r.nr); });
      break;
    case "cur": await run(()=> rpc("bt_admin_set_current", {p_code:CODE, p_pin:pin(), p_nr: S.admin.event.current_nr + Number(el.dataset.d)})); break;
    case "reveal": await run(()=> rpc("bt_admin_reveal", {p_code:CODE, p_pin:pin(), p_delta:Number(el.dataset.d)})); break;
    case "toggle-secret": S.showSecret = !S.showSecret; S.lastRenderOk=false; render(); break;
    case "toggle-results": S.showResults = !S.showResults; S.lastRenderOk=false; render(); break;
    case "add-beer": {
      const pc = pilsCheck(val("ad-name"));
      if (pc && !zaehlt(pc.s) && !confirm(`Pils-Check: ${PS[pc.s].l}. ${pc.msg}\n\nTrotzdem hinzufügen?`)) return;
    }
      await run(()=> rpc("bt_admin_add_beer", {p_code:CODE, p_pin:pin(), p_name:val("ad-name"), p_brought_by:val("ad-by"), p_price:num(val("ad-price"))}), "Bier hinzugefügt");
      break;
    case "del-beer": if (!confirm("Dieses Bier löschen?")) return;
      await run(()=> rpc("bt_admin_delete_beer", {p_code:CODE, p_pin:pin(), p_beer:el.dataset.id})); break;
    case "wiki": openWiki(Number(el.dataset.i)); break;
    case "dlg-back": dlgBack(); break;
    case "dlg-beers": dlgOpen(allBeersDlg); break;
    case "dlg-testers": dlgOpen(testersDlg); break;
    case "ab-sort": S.ab = el.dataset.s; dlgOpen(allBeersDlg, false); break;
    case "tester": { const n = el.dataset.n; dlgOpen(() => testerDlg(n)); break; }
    case "jahr": gotoJahr(el.dataset.j, el.dataset.b); break;
    case "goto": document.getElementById(el.dataset.id)?.scrollIntoView({behavior:"smooth"}); break;
    case "radar": { const r = Number(el.dataset.r); dlgOpen(() => radarDlg(r)); break; }
    case "rpin": { const k = el.dataset.k, g = Number(el.dataset.g); dlgOpen(() => rpinDlg(k, g)); break; }
    case "rk": S.rk = el.dataset.k; el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===el)); radarRefresh("map"); break;
    case "rlay": S.rlay = el.dataset.k; el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===el)); radarRefresh("map"); break;
    case "rg": S.rg = el.dataset.g; S.rlim = 24; el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===el)); radarRefresh(); break;
    case "rl": S.rl = el.dataset.l; S.rlim = 24; el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===el)); radarRefresh(); break;
    case "rrm": S.rrm = !S.rrm; S.rlim = 24; el.classList.toggle("on", S.rrm); el.textContent = (S.rrm?"✓ ":"") + "Nur in Rhein-Main / Versand"; radarRefresh(); break;
    case "r-more": S.rlim = (S.rlim || 24) + 24; radarRefresh("cards"); break;
    case "merk": { const id = el.dataset.id, M = merk.get(); merk.set(M.includes(id) ? M.filter(x=>x!==id) : [...M, id]);
      const mb = document.getElementById("merk-box"); if (mb) mb.innerHTML = merkBlock(); radarRefresh("cards");
      if (document.getElementById("wiki-dlg").open && DLG.length) dlgOpen(DLG.at(-1), false);
      toast(merk.get().includes(id) ? "📌 Auf der Merkliste" : "Von der Merkliste entfernt"); break; }
    case "merk-copy": { const t = "Pils-Merkliste fürs nächste Biertasting:\n" + merk.get().map(id=>RA.biere[RI[id]]).filter(Boolean).map(b=>`• ${b.name} (${b.ort||b.land||""}) – ${b.kaufen||""}`).join("\n");
      try { await navigator.clipboard.writeText(t); toast("Merkliste kopiert"); } catch(e){ prompt("Merkliste:", t); } break; }
    case "pl-view": plView(el.dataset.v); break;
    case "pl-bots": case "pl-me": case "pl-live": case "pl-draw": case "pl-reveal-start": case "pl-reveal": case "pl-final": case "pl-speed": case "pl-reset": plAct(name); break;
    case "kk": S.kk = el.dataset.k; document.getElementById("karte-box").innerHTML = karteBlock(); break;
    case "ky": S.ky = el.dataset.y; document.getElementById("karte-box").innerHTML = karteBlock(); break;
    case "pin": openPin(el.dataset.k, Number(el.dataset.g)); break;
    case "wiki-close": document.getElementById("wiki-dlg").close(); break;
    case "wf": S.wf = el.dataset.k; document.querySelectorAll("#wiki-f button").forEach(b=>b.classList.toggle("on", b===el)); wikiFilter(); break;
    case "open": if (DEMO && window.parent.BT_STAGE) { window.parent.BT_STAGE.show(/modus=tv/.test(el.dataset.u) ? "tv" : /modus=gastgeber/.test(el.dataset.u) ? "gastgeber" : "gast"); } else window.open(el.dataset.u, "_blank"); break;
    case "copy": try { await navigator.clipboard.writeText(el.dataset.u); toast("Link kopiert"); } catch(e){ prompt("Link zum Kopieren:", el.dataset.u); } break;
  }
}
function keepTyped(){
  if (!S.draft) return;
  const n = document.getElementById("in-notiz"), t = document.getElementById("in-tipp");
  if (n) S.draft.notiz = n.value; if (t) S.draft.tipp = t.value;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  e.preventDefault(); act(el.dataset.act, el);
});
document.addEventListener("input", e => {
  if (e.target.id === "wiki-q") { wikiFilter(); return; }
  if (e.target.id === "in-beer") { S.typedBeer = e.target.value; S.pilsOk = false; const h = document.getElementById("pils-hint"); if (h) h.innerHTML = pilsHint(e.target.value); return; }
  if (e.target.id === "in-price") { S.typedPrice = e.target.value; return; }
  if (e.target.id === "radar-q") { S.rq = e.target.value; S.rlim = 24; radarRefresh(); return; }
  if (e.target.id === "in-notiz" || e.target.id === "in-tipp") { keepTyped(); S.dirty = true; }
});
document.addEventListener("toggle", e => { if (e.target.id === "add-details") S.addOpen = e.target.open; }, true);
document.addEventListener("change", e => { if (e.target.id === "in-pilsok") S.pilsOk = e.target.checked; if (e.target.id === "in-tipp") { keepTyped(); S.dirty = true; } });
document.addEventListener("focusout", () => setTimeout(()=>{ if (!CODE) return; const a=document.activeElement; if(!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) render(); }, 50));
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
  if (e.target.closest?.("[data-act=pin]")) { const g = e.target.closest("[data-act=pin]"); act("pin", g); return; }
  const map = {"in-code":"go-code","in-name":"join","lg-pin":"login","ne-pin":"create"};
  if (map[e.target.id]) { e.preventDefault(); e.target.blur(); act(map[e.target.id]); }
});

// Start
if (CODE) setUrl();
refresh(true).then(startPolling);
</script>
